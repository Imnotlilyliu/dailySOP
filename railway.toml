[build]
buildCommand = "npm install --no-audit --no-fund"

[deploy]
startCommand = "echo '[1/3] prisma contract emit' && npx prisma contract emit && echo '[2/3] prisma db update' && npx prisma db update --db $DATABASE_URL && echo '[3/3] npm run start' && npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 30
